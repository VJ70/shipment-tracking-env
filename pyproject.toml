[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shipment-tracking-env"
version = "1.0.0"
description = "OpenEnv-compliant shipment tracking agent environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["openenv", "reinforcement-learning", "logistics", "agent", "environment"]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "openai==1.30.1",
    "openenv-core>=0.2.0",
    "pyyaml==6.0.1",
]
[project.scripts]
server = "server.app:main" 

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.openenv]
name = "shipment-tracking-env"
version = "1.0.0"
entrypoint = "main:app"
spec = "openenv.yaml"